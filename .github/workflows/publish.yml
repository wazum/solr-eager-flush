name: Publish to TER

on:
  release:
    # 'released' (not 'published') skips prereleases and fires when a
    # prerelease is promoted, leaving a window to fix release notes first.
    types: [released]

jobs:
  publish:
    name: Publish to TER
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and comment from the release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          version="$RELEASE_TAG"
          if ! [[ "$version" =~ ^[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}$ ]]; then
            echo "Tag does not match semver format: $version"
            exit 1
          fi
          echo "TER_VERSION=$version" >> "$GITHUB_ENV"

          comment="${RELEASE_BODY//[[:space:]]/}"
          if [[ -z "$comment" ]]; then
            echo "TER_COMMENT=Release $version" >> "$GITHUB_ENV"
          else
            delimiter="TER_COMMENT_EOF"
            {
              echo "TER_COMMENT<<$delimiter"
              echo "$RELEASE_BODY"
              echo "$delimiter"
            } >> "$GITHUB_ENV"
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Tailor
        run: composer global require typo3/tailor --no-interaction

      - name: Publish to TER
        env:
          TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
        run: php ~/.composer/vendor/bin/tailor ter:publish --comment "$TER_COMMENT" "$TER_VERSION" solr_eager_flush
