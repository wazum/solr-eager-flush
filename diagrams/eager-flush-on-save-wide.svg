<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="736" viewBox="0 0 1280 736" role="img" aria-labelledby="efs-wide-title efs-wide-desc" xmlns="http://www.w3.org/2000/svg">
<title id="efs-wide-title">Where the indexing happens</title>
<desc id="efs-wide-desc">A record save enqueues an item in ext:solr's index queue and the response goes straight back to the editor. The same request then keeps running: unless a gate stands down, this extension reads the pending items, indexes them into Solr, and marks them indexed. If it does stand down, the items wait for the next Index Queue Worker run.</desc>

<defs>
    <marker id="efs-w-ink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#1A1E24"/>
    </marker>
    <marker id="efs-w-muted" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#5B6570"/>
    </marker>
    <marker id="efs-w-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#ED6D05"/>
    </marker>
    <marker id="efs-w-open" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polyline points="0 0, 10 4, 0 8" fill="none" stroke="#5B6570" stroke-width="1.2"/>
    </marker>
</defs>

