<?xml version="1.0" encoding="UTF-8"?>
<svg width="344" height="616" viewBox="0 0 344 616" role="img" aria-labelledby="efs-narrow-title efs-narrow-desc" xmlns="http://www.w3.org/2000/svg">
<title id="efs-narrow-title">Where the indexing happens</title>
<desc id="efs-narrow-desc">A record save enqueues an item in ext:solr's index queue and the response goes straight back to the editor. The same request then indexes those items into Solr, unless a gate stands down, in which case they wait for the next Index Queue Worker run.</desc>

<defs>
    <marker id="efs-n-ink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#1A1E24"/>
    </marker>
    <marker id="efs-n-accent" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#ED6D05"/>
    </marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<line x1="172" y1="104" x2="172" y2="140" stroke="#1A1E24" stroke-width="2" marker-end="url(#efs-n-ink)"/>
<rect x="184" y="112" width="112" height="12" rx="2" fill="#FFFFFF"/>
<text x="188" y="122" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">ENQUEUED</text>

<line x1="172" y1="224" x2="172" y2="292" stroke="#ED6D05" stroke-width="2" marker-end="url(#efs-n-accent)"/>
<rect x="184" y="248" width="128" height="12" rx="2" fill="#FFFFFF"/>
<text x="188" y="258" fill="#A05E00" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">SAME REQUEST</text>

<line x1="172" y1="376" x2="172" y2="412" stroke="#1A1E24" stroke-width="2" marker-end="url(#efs-n-ink)"/>
<rect x="184" y="384" width="128" height="12" rx="2" fill="#FFFFFF"/>
<text x="188" y="394" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.06em">INDEX, COMMIT</text>

<rect x="24" y="24" width="296" height="80" rx="6" fill="#FFFFFF"/>
<rect x="24" y="24" width="296" height="80" rx="6" fill="rgba(91,101,112,0.10)" stroke="#5B6570" stroke-width="1"/>
<text x="172" y="60" fill="#1A1E24" font-size="16" font-weight="600" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">An editor saves</text>
<text x="172" y="84" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">the response goes back at once</text>

<rect x="24" y="144" width="296" height="80" rx="6" fill="#FFFFFF"/>
<rect x="24" y="144" width="296" height="80" rx="6" fill="rgba(26,30,36,0.05)" stroke="#5B6570" stroke-width="1"/>
<text x="172" y="180" fill="#1A1E24" font-size="16" font-weight="600" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">Index queue</text>
<text x="172" y="204" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">tx_solr_indexqueue_item</text>

<rect x="24" y="292" width="296" height="84" rx="6" fill="#FFFFFF"/>
<rect x="24" y="292" width="296" height="84" rx="6" fill="rgba(255,135,0,0.10)" stroke="#ED6D05" stroke-width="1.2"/>
<rect x="36" y="304" width="128" height="22" rx="3" fill="transparent" stroke="rgba(237,109,5,0.50)" stroke-width="0.8"/>
<text x="100" y="315" fill="#A05E00" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.08em" dy="4">AFTER THE REPLY</text>
<text x="172" y="348" fill="#1A1E24" font-size="16" font-weight="600" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">This extension flushes</text>
<text x="172" y="368" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">unless a gate stands down</text>

<rect x="24" y="412" width="296" height="80" rx="6" fill="#FFFFFF"/>
<rect x="24" y="412" width="296" height="80" rx="6" fill="rgba(26,30,36,0.03)" stroke="rgba(26,30,36,0.30)" stroke-width="1"/>
<text x="172" y="448" fill="#1A1E24" font-size="16" font-weight="600" font-family="'Open Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">Solr has it</text>
<text x="172" y="472" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle">no scheduler run needed</text>

<line x1="24" y1="536" x2="320" y2="536" stroke="rgba(26,30,36,0.12)" stroke-width="0.8"/>
<text x="24" y="560" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.10em">IF A GATE STANDS DOWN,</text>
<text x="24" y="580" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.10em">THE INDEX QUEUE WORKER</text>
<text x="24" y="600" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.10em">INDEXES IT LATER.</text>
</svg>
