services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    Wazum\SolrEagerFlush\:
        resource: '../Classes/*'
        exclude:
            - '../Classes/Drainer/TypeFilteringQueue.php'

    Wazum\SolrEagerFlush\Drainer\SiteIndexer: '@Wazum\SolrEagerFlush\Drainer\IndexServiceSiteIndexer'

    Wazum\SolrEagerFlush\Site\SiteRootResolver: '@Wazum\SolrEagerFlush\Site\CoreSiteRootResolver'

    Wazum\SolrEagerFlush\Site\SiteEagerFlushPolicy: '@Wazum\SolrEagerFlush\Site\SiteConfigEagerFlushPolicy'

    Wazum\SolrEagerFlush\Site\SolrReachability: '@Wazum\SolrEagerFlush\Site\ConnectionManagerSolrReachability'

    Wazum\SolrEagerFlush\Runtime\ResponseDetacher: '@Wazum\SolrEagerFlush\Runtime\SapiResponseDetacher'

    Wazum\SolrEagerFlush\Runtime\DeferredExecution: '@Wazum\SolrEagerFlush\Runtime\PhpShutdownDeferredExecution'

    Wazum\SolrEagerFlush\Drainer\EagerFlushRunner:
        arguments:
            $gates: !tagged_iterator solr_eager_flush.gate

    Wazum\SolrEagerFlush\Configuration\ExtensionConfiguration:
        factory: ['Wazum\SolrEagerFlush\Configuration\ExtensionConfiguration', 'from']
        arguments:
            $extensionConfiguration: '@TYPO3\CMS\Core\Configuration\ExtensionConfiguration'

    _instanceof:
        Wazum\SolrEagerFlush\Gate\EagerFlushGate:
            tags: ['solr_eager_flush.gate']

    Wazum\SolrEagerFlush\EventListener\EagerFlushListener:
        tags:
            - name: event.listener
              identifier: 'solr-eager-flush/eager-flush'
              event: ApacheSolrForTypo3\Solr\Domain\Index\Queue\UpdateHandler\EventListener\Events\ProcessingFinishedEvent
